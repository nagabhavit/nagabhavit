name: refresh profile

on:
  schedule:
    - cron: "17 2 * * *" # daily; the punch card flips on Mondays
  workflow_dispatch:
  push:
    paths:
      - "scripts/**"
      - ".github/workflows/profile.yml"

permissions:
  contents: write

concurrency:
  group: profile
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install fonttools brotli

      - name: Regenerate punch card and telemetry
        run: python scripts/profile_bot.py
        env:
          # Optional: add a PROFILE_TOKEN secret (classic PAT, read:user) to count private contributions too.
          GH_TOKEN: ${{ secrets.PROFILE_TOKEN || secrets.GITHUB_TOKEN }}

      - name: Commit if anything changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/punchcard.svg assets/telemetry.svg
          git diff --cached --quiet && { echo "nothing new"; exit 0; }
          git commit -m "chore(profile): refresh punch card and telemetry"
          git push
